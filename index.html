<head>
  <meta charset="UTF-8" />

  <title>Shubham Kondhalkar | Portfolio</title>
  <style>
    #preloader {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background-color: #060B14;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.6s;
    }

    #preloader.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    .preloader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .preloader-logo {
      position: relative;
      width: 70px;
      height: 70px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      border: 1px solid rgba(255, 77, 90, 0.2);
      background: rgba(255, 77, 90, 0.02);
    }

    .logo-text {
      color: #FF4D5A;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.05em;
      font-family: "Reem Kufi", sans-serif;
    }

    .logo-glow {
      position: absolute;
      inset: -1px;
      border-radius: 50%;
      border: 1px solid #FF4D5A;
      opacity: 0.2;
      animation: pulse 2s infinite ease-in-out;
    }

    .progress-container {
      width: 160px;
      height: 2px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #FF4D5A;
      border-radius: 4px;
      box-shadow: 0 0 8px rgba(255, 77, 90, 0.4);
      transition: width 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .loading-text {
      color: rgba(244, 244, 245, 0.3);
      font-size: 10px;
      letter-spacing: 0.2em;
      font-weight: 500;
      text-transform: uppercase;
      font-family: "JetBrains Mono", monospace;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 0.2;
      }

      50% {
        transform: scale(1.08);
        opacity: 0.5;
        box-shadow: 0 0 12px rgba(255, 77, 90, 0.3);
      }

      100% {
        transform: scale(1);
        opacity: 0.2;
      }
    }
  </style>
</head>
